name: Dependency Refresh

on:
  push:
    branches:
      - fix/production-readiness
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Upgrade vulnerable dependencies
        run: |
          npm install --save-exact next@16.3.5 eslint-config-next@16.3.5
          npm audit fix
          npm audit --omit=dev --audit-level=high

      - name: Commit refreshed dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency files already up to date."
          else
            git commit -m "Upgrade vulnerable runtime dependencies"
            git push
          fi
